name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests, build, identity and format tests
        run: npm test

      - name: Verify entry points import (ESM and CJS)
        run: |
          node --input-type=module -e "const m = await import('geo-engine-node'); if (typeof m.GeoEngine !== 'function') throw new Error('ESM root: GeoEngine export missing'); console.log('ESM root ok:', Object.keys(m).length, 'exports')"
          node -e "const m = require('geo-engine-node'); if (typeof m.GeoEngine !== 'function') throw new Error('CJS root: GeoEngine export missing'); console.log('CJS root ok:', Object.keys(m).length, 'exports')"
          node --input-type=module -e "const m = await import('geo-engine-node/identity'); if (typeof m.identityGuard !== 'function') throw new Error('ESM identity: identityGuard export missing'); console.log('ESM identity ok:', Object.keys(m).length, 'exports')"
          node -e "const m = require('geo-engine-node/identity'); if (typeof m.identityGuard !== 'function') throw new Error('CJS identity: identityGuard export missing'); console.log('CJS identity ok:', Object.keys(m).length, 'exports')"

      - name: List package contents (dry run, nothing is published)
        run: npm pack --dry-run --ignore-scripts
